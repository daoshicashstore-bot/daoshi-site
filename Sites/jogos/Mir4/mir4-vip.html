<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Daoshi VIP - MIR4</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1lLnjQ3NYt6Bd6WapJ2p0EjzfQJIbB-es">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../shared/viewport-fix.css">
  
  <style>
    :root {
      --bg-dark: #0f0a1a;
      --bg-card: rgba(61, 27, 45, 0.92);
      --bg-card-hover: #301d24;
      --purple: #ff1493;
      --purple-light: #ff69b4;
      --purple-dark: #c71585;
      --gold: #ffd700;
      --gold-light: #ffbf00;
      --text-primary: #f5f5f5;
      --text-secondary: #ff69b4;
      --border: #ff69b4;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: rgba(0, 0, 0, 0.5);
      --panel-bg: rgba(61, 27, 45, 0.92);
      --panel-border: #ff69b4;
      --star-pink: #ff1493;
      --star-yellow: #ffd700;
      --star-blue: #ff69b4;
      --star-purple: #ff1493;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: none;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    
    body {
      background-image: url('https://lh3.googleusercontent.com/d/1ECtr_z7YWp_QugVyvTQBWTiV9d88m5zS');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Press Start 2P', cursive;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
      font-size: 10px;
      line-height: 1.6;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, 
        rgba(36, 13, 26, 0.90) 0%,
        rgba(255, 20, 147, 0.3) 30%,
        rgba(255, 105, 180, 0.3) 60%,
        rgba(61, 27, 45, 0.90) 100%
      );
      z-index: -1;
    }
    
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.05) 0px,
        rgba(0, 0, 0, 0.05) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9999;
      animation: scanlines 8s linear infinite;
    }
    
    @keyframes scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(10px); }
    }
    
    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-grow: 1;
    }
    
    header {
      text-align: center;
      position: relative;
      flex-shrink: 0;
    }
    
    header h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 24px;
      color: var(--star-yellow);
      text-shadow: 
        4px 0 0 var(--star-pink),
        -4px 0 0 var(--star-pink),
        0 4px 0 var(--star-pink),
        0 -4px 0 var(--star-pink),
        4px 4px 0 var(--star-pink),
        -4px -4px 0 var(--star-pink),
        4px -4px 0 var(--star-pink),
        -4px 4px 0 var(--star-pink);
      animation: float 3s ease-in-out infinite, title-glow 2s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes title-glow {
      0%, 100% { 
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 20px rgba(255, 20, 147, 0.5));
      }
      50% { 
        filter: drop-shadow(0 0 25px rgba(255, 215, 0, 1)) drop-shadow(0 0 35px rgba(255, 20, 147, 0.9));
      }
    }
    
    header p {
      color: var(--star-yellow);
      font-weight: 400;
      font-size: 10px;
      margin-top: 15px;
      text-shadow: 2px 2px 0 var(--star-purple);
    }
    
    .vip-badge {
      display: inline-block;
      background: linear-gradient(45deg, #ff6b6b, #ffd700);
      color: #000;
      padding: 8px 16px;
      border-radius: 0;
      font-size: 9px;
      font-weight: bold;
      margin-top: 10px;
      border: 3px solid var(--star-yellow);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      animation: pulse-vip 2s infinite;
    }
    
    @keyframes pulse-vip {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .cotacao-display {
      margin-top: 15px;
      background: var(--star-purple);
      padding: 10px 20px;
      border-radius: 0;
      font-size: 10px;
      border: 4px solid var(--star-yellow);
      box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
      display: inline-flex;
      align-items: center;
      color: #00d9ff;
    }
    
    .cotacao-display .icon { 
      margin-right: 10px; 
      color: var(--star-yellow);
      font-size: 16px;
    }
    .cotacao-display .value { 
      font-weight: 600; 
      color: var(--gold);
      text-shadow: 
        2px 2px 0 rgba(0, 0, 0, 0.9),
        0 0 10px rgba(255, 215, 0, 0.8);
    }

    .main-layout {
        display: flex;
        gap: 20px;
        flex-grow: 1;
    }

    .left-column {
        flex: 2;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .right-column {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    
    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-shrink: 0;
    }

    .tab-button {
      padding: 15px 30px;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      border: 4px solid var(--star-yellow);
      background: var(--star-purple);
      color: var(--text-color);
      border-radius: 0;
      border-bottom: none;
      position: relative;
      overflow: hidden;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }

    .tab-button.active {
      background: var(--star-pink);
      color: var(--text-color);
      border-color: var(--star-yellow);
      transform: translateY(0px);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5), 0 0 20px var(--star-yellow);
      animation: pulse-border 1.5s infinite;
    }
    
    @keyframes pulse-border {
      0%, 100% { box-shadow: 4px 4px 0 rgba(0,0,0,0.5), 0 0 20px var(--star-yellow); }
      50% { box-shadow: 4px 4px 0 rgba(0,0,0,0.5), 0 0 30px var(--star-yellow); }
    }
    
    .tab-content {
        flex-grow: 1;
        margin-top: -12px;
    }
    
    .tab-pane {
        height: 100%;
        display: none;
    }
    .tab-pane.active {
        display: block;
    }
    
    .panel {
      background: var(--panel-bg);
      border-radius: 0;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
      border: 4px solid var(--panel-border);
      backdrop-filter: none;
      padding: 20px;
      animation: fadeIn 0.6s ease forwards;
      height: auto;
      position: relative;
    }
    
    .panel::before {
      content: '⭐';
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      animation: star-spin 4s linear infinite;
      filter: drop-shadow(0 0 8px rgba(255, 237, 78, 0.8));
    }
    
    .panel::after {
      content: '💫';
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 20px;
      animation: star-spin-reverse 5s linear infinite;
      filter: drop-shadow(0 0 8px rgba(255, 110, 199, 0.8));
    }
    
    @keyframes star-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes star-spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    
    .tab-content .panel {
        border-top-left-radius: 0;
        border-top-right-radius: 0;
    }
    
    .panel-content-wrapper {
        display: grid;
        grid-template-columns: 1.5fr 2fr;
        gap: 20px;
    }

    .login-section {
        grid-column: 2;
    }

    .panel-header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    h2 {
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      font-weight: 400;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
      color: var(--star-yellow);
      display: inline-block;
      position: relative;
      padding: 5px 10px;
      background: var(--star-purple);
      border: 3px solid var(--star-yellow);
    }
    
    h3 {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      font-weight: 400;
      margin-top: 15px;
      margin-bottom: 10px;
      color: var(--star-yellow);
      text-align: center;
      border-bottom: 3px solid var(--panel-border);
      padding-bottom: 10px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    
    .form-group { margin-bottom: 15px; }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 400;
      color: var(--star-yellow);
      font-size: 9px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 20, 147, 0.2);
      color: #00d9ff;
      border: 3px solid var(--star-yellow);
      border-radius: 0;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }
    
    input[type="number"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--star-pink);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5), 0 0 15px var(--star-pink);
    }
    
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    
    .result-group {
      margin: 15px 0;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0;
      border: 3px solid var(--star-blue);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }
    
    .result-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 10px; 
      font-size: 9px;
    }
    .result-item:last-child { margin-bottom: 0; }
    .result-label { 
      font-weight: 400;
      color: var(--star-yellow);
    }
    .result-value { 
      font-weight: 400; 
      color: var(--star-pink);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .result-value small { 
      font-size: 0.8em; 
      opacity: 0.9;
      color: var(--star-blue);
    }
    
    .pacote-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
    
    .btn { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      padding: 15px 20px; 
      background: var(--button-primary); 
      color: white; 
      border: 3px solid var(--star-yellow); 
      border-radius: 0; 
      font-family: 'Press Start 2P', cursive; 
      font-size: 10px; 
      font-weight: 400; 
      cursor: pointer; 
      box-shadow: 6px 6px 0 rgba(0,0,0,0.5); 
      position: relative; 
      overflow: hidden; 
      width: 100%;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .btn:hover { 
      background: var(--button-hover); 
      transform: translate(-2px, -2px); 
      box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
    }
    .btn:active { 
      background: var(--button-active); 
      transform: translate(2px, 2px); 
      box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .btn svg { width: 14px; height: 14px; margin-right: 10px; }
    
    .total-grand { 
      font-size: 11px; 
      font-weight: 400; 
      margin-bottom: 15px; 
      text-align: center; 
      color: var(--star-yellow); 
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .total-grand span { 
      display: block; 
      margin-top: 8px; 
      font-size: 14px;
      color: var(--star-pink);
      text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    }
    .total-grand span small { 
      font-size: 0.7em; 
      opacity: 0.9;
      color: var(--star-blue);
    }

    .tooltip { 
      position: fixed; 
      background: var(--star-purple); 
      color: white; 
      padding: 12px 18px; 
      border-radius: 0; 
      font-size: 9px; 
      z-index: 1000; 
      pointer-events: none; 
      opacity: 0; 
      transition: opacity 0.3s; 
      box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
      border: 3px solid var(--star-yellow);
    }
    
    .payment-methods { display: flex; flex-direction: column; gap: 15px; }
    .payment-method { 
      padding: 15px; 
      background: rgba(0, 0, 0, 0.5); 
      border-radius: 0; 
      border: 3px solid var(--star-blue); 
      position: relative;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }
    .payment-method-title { 
      display: flex; 
      align-items: center; 
      font-size: 11px; 
      margin-bottom: 12px; 
      color: var(--star-yellow);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .payment-method-title span { margin-left: 8px; }
    .payment-details { 
      font-size: 9px;
      line-height: 1.8;
      color: #00d9ff;
    }
    .payment-details strong { 
      color: #00d9ff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 1024px) {
        .main-layout {
            flex-direction: column;
        }
        .panel-content-wrapper {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 768px) {
        body { 
          padding: 10px;
          font-size: 9px;
        }
        header h1 { 
          font-size: 16px;
        }
        header p {
          font-size: 8px;
        }
        .tab-button { 
          font-size: 9px; 
          padding: 12px 20px;
        }
        .panel { 
          padding: 15px;
        }
        .pacote-section { 
          grid-template-columns: 1fr 1fr;
        }
        h2 {
          font-size: 11px;
        }
        h3 {
          font-size: 9px;
        }
        label {
          font-size: 8px;
        }
    }
    
    .star-gif {
      position: fixed;
      bottom: 15px;
      right: 15px;
      width: 240px;
      height: auto;
      z-index: 1000;
      pointer-events: none;
      filter: 
        drop-shadow(0 0 15px rgba(153, 51, 255, 0.8)) 
        drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⭐ Daoshi Store VIP ⭐</h1>
      <p>✨ MIR4 - Preços Exclusivos ✨</p>
      <div class="vip-badge">🌟 CLIENTE VIP 🌟</div>
      <div class="cotacao-display">
        <span class="icon">💫</span>
        <span id="cotacao">Carregando cotação...</span>
      </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="tab-buttons">
                <button class="tab-button active" onclick="showTab('topup')">💫 Top Up VIP 💫</button>
            </div>
            <div class="tab-content">
                <div id="topupTab" class="tab-pane active">
                    <div class="panel">
                        <div class="panel-content-wrapper">
                            <div>
                                <h3>Pacotes VIP</h3>
                                <div class="pacote-section">
                                    <div class="form-group"><label for="pacote1">$1</label><input type="number" id="pacote1" value="0" oninput="updatePacoteQuantidades(1, this.value);"></div>
                                    <div class="form-group"><label for="pacote3">$3</label><input type="number" id="pacote3" value="0" oninput="updatePacoteQuantidades(3, this.value);"></div>
                                    <div class="form-group"><label for="pacote5">$5</label><input type="number" id="pacote5" value="0" oninput="updatePacoteQuantidades(5, this.value);"></div>
                                    <div class="form-group"><label for="pacote10">$10</label><input type="number" id="pacote10" value="0" oninput="updatePacoteQuantidades(10, this.value);"></div>
                                    <div class="form-group"><label for="pacote30">$30</label><input type="number" id="pacote30" value="0" oninput="updatePacoteQuantidades(30, this.value);"></div>
                                    <div class="form-group"><label for="pacote50">$50</label><input type="number" id="pacote50" value="0" oninput="updatePacoteQuantidades(50, this.value);"></div>
                                    <div class="form-group"><label for="pacote100">$100</label><input type="number" id="pacote100" value="0" oninput="updatePacoteQuantidades(100, this.value);"></div>
                                </div>
                            </div>
                            <div class="login-section">
                                <h3>Informações da Conta</h3>
                                <div class="form-group"><label for="login">Login:</label><input type="text" id="login" placeholder="Digite o login"></div>
                                <div class="form-group"><label for="password">Senha:</label><input type="text" id="password" placeholder="Digite a senha"></div>
                                <div class="form-group"><label for="nickname">Nickname:</label><input type="text" id="nickname" placeholder="Digite o nickname"></div>
                                <div class="form-group"><label for="level">Level:</label><input type="text" id="level" placeholder="Digite o level"></div>
                                <div class="form-group"><label for="server">Servidor:</label><input type="text" id="server" placeholder="Digite o servidor"></div>
                                <div class="form-group"><label for="metodoLogin">Método de Login:</label><input type="text" id="metodoLogin" placeholder="Ex: Facebook, Google"></div>
                                <button class="btn" onclick="saveLoginData(event)" style="margin-top: 10px;">
                                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                                  Salvar Dados da Conta
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="panel">
                <div class="panel-header">
                    <h2>🌸 Resumo do Pedido 🌸</h2>
                </div>
                <div class="result-group">
                    <div class="result-item">
                        <div class="result-label">Total Top Up:</div>
                        <div class="result-value" id="summaryTopUpDisplay">R$0.00</div>
                    </div>
                    <hr style="border-color: var(--panel-border); margin: 8px 0;">
                    <div class="total-grand">
                        Total a Pagar
                        <span id="summaryTotalDisplay">R$0.00</span>
                    </div>
                </div>
                <button class="btn" onclick="copySmartClipboard(event)">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  Copiar Resumo do Pedido
                </button>
                <div class="payment-methods">
                    <h3>Formas de Pagamento</h3>
                    <div class="payment-method">
                        <div class="payment-method-title"><span>Pix</span></div>
                        <div class="payment-details">
                            <p><strong>CELULAR:</strong> <span id="pixCelular">14988231270</span></p>
                            <p><strong>Nome:</strong> <span id="pixNome">DAOSHI TRADE</span></p>
                        </div>
                    </div>
                    <div class="payment-method">
                        <div class="payment-method-title"><span>Binance</span></div>
                        <div class="payment-details"><p><strong>ID:</strong> <span id="binanceId">1202540648</span></p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <img src="https://media.giphy.com/media/bzawYMvJVw0KPA0u7M/giphy.gif" alt="Star Butterfly" class="star-gif">

<script>
    // PREÇOS VIP - MIR4
    const VIP_CONFIG = {
        defaultExchangeRate: 5.30,
        topUpPackages: {
            1:   { price: 0.80 },
            3:   { price: 2.30 },
            5:   { price: 3.65 },
            10:  { price: 7.35 },
            30:  { price: 22.05 },
            50:  { price: 39.50 },
            100: { price: 73.50 }
        }
    };

    let exchangeRate = VIP_CONFIG.defaultExchangeRate;
    let pacoteQuantidades = { 1: 0, 3: 0, 5: 0, 10: 0, 30: 0, 50: 0, 100: 0 };
    
    window.onload = function() {
      setupEventListeners();
      loadLoginData();
      atualizarCotacaoDolar();
      setInterval(() => {
        atualizarCotacaoDolar();
      }, 5 * 60 * 1000);
    };
    
    function showTab(tabName) {
        document.querySelectorAll('.tab-pane').forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabName + 'Tab').classList.add('active');
        document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));
        document.querySelector(`.tab-button[onclick="showTab('${tabName}')"]`).classList.add('active');
    }
    
    function setupEventListeners() {
        document.querySelectorAll('input').forEach(input => {
            if (input.type === 'number') {
                input.addEventListener('focus', () => { if (input.value === '0') input.value = ''; });
                input.addEventListener('blur', () => { if (input.value === '') input.value = '0'; });
            }
        });
    }
    
    function showTooltip(message, event) {
        const tooltip = document.getElementById("tooltip");
        tooltip.textContent = message;
        const rect = event.target.getBoundingClientRect();
        tooltip.style.left = `${rect.left + rect.width / 2 - tooltip.offsetWidth / 2}px`;
        tooltip.style.top = `${rect.top - tooltip.offsetHeight - 10}px`;
        tooltip.style.opacity = "1";
        setTimeout(() => { tooltip.style.opacity = "0"; }, 2000);
    }
    
    function saveLoginData(event) {
        const loginData = {
            login: document.getElementById('login').value,
            password: document.getElementById('password').value,
            nickname: document.getElementById('nickname').value,
            level: document.getElementById('level').value,
            server: document.getElementById('server').value,
            metodoLogin: document.getElementById('metodoLogin').value
        };
        
        try {
            localStorage.setItem('mir4_vip_login', JSON.stringify(loginData));
            showTooltip("Dados salvos com sucesso! ✨", event);
        } catch (error) {
            console.error('Erro ao salvar dados:', error);
            showTooltip("Erro ao salvar dados!", event);
        }
    }
    
    function loadLoginData() {
        try {
            const savedData = localStorage.getItem('mir4_vip_login');
            if (savedData) {
                const loginData = JSON.parse(savedData);
                document.getElementById('login').value = loginData.login || '';
                document.getElementById('password').value = loginData.password || '';
                document.getElementById('nickname').value = loginData.nickname || '';
                document.getElementById('level').value = loginData.level || '';
                document.getElementById('server').value = loginData.server || '';
                document.getElementById('metodoLogin').value = loginData.metodoLogin || '';
            }
        } catch (error) {
            console.error('Erro ao carregar dados:', error);
        }
    }
    
    function updatePacoteQuantidades(pacote, quantidade) {
        pacoteQuantidades[pacote] = parseInt(quantidade) || 0;
        updatePacoteTotals();
    }
    
    function updatePacoteTotals() {
        let totalD = 0;
        Object.keys(pacoteQuantidades).forEach(pacote => {
            totalD += (pacoteQuantidades[pacote] || 0) * VIP_CONFIG.topUpPackages[pacote].price;
        });
        
        const totalR = totalD * exchangeRate;
        
        const safeR = isNaN(totalR) ? 0 : totalR;
        const safeD = isNaN(totalD) ? 0 : totalD;

        document.getElementById("summaryTopUpDisplay").innerHTML = `R$${safeR.toFixed(2)} <small>/ $${safeD.toFixed(2)}</small>`;
        document.getElementById("summaryTotalDisplay").innerHTML = `R$${safeR.toFixed(2)} <small>/ $${safeD.toFixed(2)}</small>`;
    }
    
    async function atualizarCotacaoDolar() {
      const cotacaoEl = document.getElementById('cotacao');
      if (!cotacaoEl) return;
      
      cotacaoEl.innerHTML = `<span class="value">⏳ Buscando cotação...</span>`;
      
      try {
        const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTBRL');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        exchangeRate = parseFloat(data.price) * 1.004; // +0.4% de margem
        
        if (isNaN(exchangeRate)) throw new Error('Valor inválido recebido');
        
        cotacaoEl.innerHTML = `Cotação USDT/BRL: <span class="value">R$${exchangeRate.toFixed(2)}</span>`;
      } catch (error) {
        console.error('Erro ao buscar cotação:', error);
        exchangeRate = VIP_CONFIG.defaultExchangeRate;
        cotacaoEl.innerHTML = `Cotação USDT/BRL: <span class="value">R$${exchangeRate.toFixed(2)} (offline)</span>`;
      }
      
      updatePacoteTotals();
    }
    
    function getFormValues() {
        const data = {
            hasTopUp: false,
            pacotesTexto: '', totalPacotesR: 0, totalPacotesD: 0,
            login: document.getElementById('login').value,
            password: document.getElementById('password').value,
            nickname: document.getElementById('nickname').value,
            level: document.getElementById('level').value,
            server: document.getElementById('server').value,
            metodoLogin: document.getElementById('metodoLogin').value
        };
        
        Object.keys(pacoteQuantidades).forEach(p => {
            const qtd = pacoteQuantidades[p];
            if (qtd > 0) {
                data.hasTopUp = true;
                const preco = VIP_CONFIG.topUpPackages[p].price;
                const subtotalD = qtd * preco;
                data.pacotesTexto += `  - Pacote de $${p}: ${qtd} un.\n`;
                data.totalPacotesD += subtotalD;
            }
        });
        data.totalPacotesR = data.totalPacotesD * exchangeRate;
        return data;
    }
    
    function copySmartClipboard(event) {
        const data = getFormValues();
        if (!data.hasTopUp) {
            showTooltip("Preencha pelo menos um pacote!", event);
            return;
        }
        
        let texto = "⭐ RESUMO DO PEDIDO DAOSHI VIP ⭐\n";
        texto += "🎮 JOGO: MIR4\n";
        texto += "---------------------------------\n";
        texto += `💮 TOP UP VIP\n${data.pacotesTexto}`;
        texto += `  - Valor: R$${data.totalPacotesR.toFixed(2)} / $${data.totalPacotesD.toFixed(2)}\n---------------------------------\n`;
        
        const loginFields = [];
        if (data.login) loginFields.push(`Login: ${data.login}`);
        if (data.password) loginFields.push(`Senha: ${data.password}`);
        if (data.nickname) loginFields.push(`Nick: ${data.nickname}`);
        if (data.server) loginFields.push(`Servidor: ${data.server}`);
        if (data.level) loginFields.push(`Level: ${data.level}`);
        if (data.metodoLogin) loginFields.push(`Método: ${data.metodoLogin}`);
        
        if (loginFields.length > 0) {
            texto += `👤 DADOS DA CONTA\n\`\`\`\n${loginFields.join('\n')}\n\`\`\`\n---------------------------------\n`;
        }
        
        texto += `💰 TOTAL: R$${data.totalPacotesR.toFixed(2)} / $${data.totalPacotesD.toFixed(2)}\n`;
        const pixCelular = document.getElementById('pixCelular').innerText;
        const pixNome = document.getElementById('pixNome').innerText;
        const binanceEmail = document.getElementById('binanceEmail').innerText;
        texto += "---------------------------------\n";
        texto += "🌸 INFORMAÇÕES DE PAGAMENTO 🌸\n";
        texto += `PIX (Celular): ${pixCelular}\n`;
        texto += `Nome: ${pixNome}\n\n`;
        texto += `Binance (Email): ${binanceEmail}\n`;
        
        navigator.clipboard.writeText(texto).then(() => {
            showTooltip("Resumo copiado!", event);
        }).catch(err => {
            console.error('Falha ao copiar: ', err);
            showTooltip("Erro ao copiar!", event);
        });
    }
</script>
