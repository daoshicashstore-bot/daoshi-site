<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Sombra - Daoshi Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #0d1f1f 50%, #0a1515 100%);
      min-height: 100vh;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    /* Efeito de partículas/linhas no fundo */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(0, 255, 200, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 200, 180, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 255, 220, 0.02) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 30px 0;
      margin-bottom: 30px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ffc8, #00d4aa, #00ffc8, transparent);
      box-shadow: 0 0 20px #00ffc8;
    }

    .logo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(180deg, #00ffc8 0%, #00d4aa 50%, #008b72 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(0, 255, 200, 0.5);
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #00d4aa;
      opacity: 0.8;
      letter-spacing: 2px;
    }

    /* Cards Container */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    /* Package Card */
    .package-card {
      background: linear-gradient(145deg, rgba(0, 30, 30, 0.9) 0%, rgba(0, 20, 20, 0.95) 100%);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 15px;
      padding: 20px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .package-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00ffc8, #00d4aa, #00ffc8);
      opacity: 0.8;
    }

    .package-card:hover {
      border-color: rgba(0, 255, 200, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.15);
      transform: translateY(-3px);
    }

    .package-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .package-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #00ffc8;
    }

    .package-price {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #00d4aa;
    }

    .package-price span {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .qty-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #00ffc8;
      background: rgba(0, 255, 200, 0.1);
      color: #00ffc8;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: rgba(0, 255, 200, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
    }

    .qty-btn:active {
      transform: scale(0.95);
    }

    .qty-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      min-width: 50px;
      text-align: center;
    }

    .package-subtotal {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 255, 200, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subtotal-label {
      color: #888;
      font-size: 0.9rem;
    }

    .subtotal-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #00ffc8;
    }

    /* Total Section */
    .total-section {
      background: linear-gradient(145deg, rgba(0, 50, 45, 0.9) 0%, rgba(0, 30, 28, 0.95) 100%);
      border: 2px solid #00ffc8;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.2);
    }

    .total-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 255, 200, 0.05) 0%, transparent 50%);
      animation: pulse 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .total-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #00d4aa;
      letter-spacing: 3px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .total-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(180deg, #00ffc8 0%, #00d4aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      text-shadow: 0 0 50px rgba(0, 255, 200, 0.5);
      z-index: 1;
    }

    .total-currency {
      font-size: 1.5rem;
      opacity: 0.8;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }

    .action-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 15px 35px;
      border: 2px solid #00ffc8;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .btn-reset {
      background: transparent;
      color: #00ffc8;
    }

    .btn-reset:hover {
      background: rgba(0, 255, 200, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
    }

    .btn-paid {
      background: linear-gradient(135deg, #00ffc8 0%, #00d4aa 100%);
      color: #0a1515;
      border-color: #00ffc8;
    }

    .btn-paid:hover {
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.5);
      transform: translateY(-2px);
    }

    /* Settings Section */
    .settings-section {
      margin-top: 40px;
      background: linear-gradient(145deg, rgba(0, 30, 30, 0.8) 0%, rgba(0, 20, 20, 0.9) 100%);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 15px;
      padding: 25px;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding-bottom: 15px;
    }

    .settings-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #00d4aa;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-toggle {
      color: #00ffc8;
      font-size: 1.5rem;
      transition: transform 0.3s ease;
    }

    .settings-toggle.open {
      transform: rotate(180deg);
    }

    .settings-content {
      display: none;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 255, 200, 0.2);
    }

    .settings-content.show {
      display: block;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-label {
      font-size: 0.9rem;
      color: #888;
    }

    .setting-input {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 8px;
      padding: 10px 15px;
      color: #00ffc8;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .setting-input:focus {
      outline: none;
      border-color: #00ffc8;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
    }

    .save-settings-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00ffc8 0%, #00d4aa 100%);
      border: none;
      border-radius: 10px;
      color: #0a1515;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .save-settings-btn:hover {
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.5);
    }

    /* History Section */
    .history-section {
      margin-top: 30px;
      background: linear-gradient(145deg, rgba(0, 30, 30, 0.8) 0%, rgba(0, 20, 20, 0.9) 100%);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 15px;
      padding: 25px;
    }

    .history-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #00d4aa;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 3px solid #00ffc8;
    }

    .history-date {
      color: #888;
      font-size: 0.85rem;
    }

    .history-amount {
      font-family: 'Orbitron', sans-serif;
      color: #00ffc8;
      font-weight: 600;
    }

    .history-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-paid {
      background: rgba(0, 255, 100, 0.2);
      color: #00ff64;
    }

    .status-pending {
      background: rgba(255, 200, 0, 0.2);
      color: #ffc800;
    }

    .history-delete {
      background: rgba(255, 50, 50, 0.2);
      border: 1px solid rgba(255, 50, 50, 0.5);
      color: #ff5050;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .history-delete:hover {
      background: rgba(255, 50, 50, 0.4);
      box-shadow: 0 0 10px rgba(255, 50, 50, 0.3);
    }

    .no-history {
      text-align: center;
      color: #666;
      padding: 30px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 30px;
      color: #555;
      font-size: 0.9rem;
    }

    .footer a {
      color: #00d4aa;
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .logo-title {
        font-size: 2rem;
      }

      .total-value {
        font-size: 3rem;
      }

      .action-buttons {
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
      }
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    ::-webkit-scrollbar-thumb {
      background: #00d4aa;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00ffc8;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #00ffc8 0%, #00d4aa 100%);
      color: #0a1515;
      padding: 15px 25px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="logo-title">SOMBRA</h1>
      <p class="subtitle">GAME STORE • CALCULADORA</p>
    </div>

    <!-- Package Cards -->
    <div class="cards-container" id="cardsContainer">
      <!-- Cards serão gerados via JavaScript -->
    </div>

    <!-- Total Section -->
    <div class="total-section">
      <div class="total-label">TOTAL DEVIDO</div>
      <div class="total-value">
        <span class="total-currency">$</span><span id="totalValue">0.00</span>
      </div>
      
      <div class="action-buttons">
        <button class="action-btn btn-reset" onclick="resetAll()">🔄 ZERAR TUDO</button>
        <button class="action-btn btn-paid" onclick="markAsPaid()">✅ PAGO</button>
      </div>
    </div>

    <!-- Settings Section -->
    <div class="settings-section">
      <div class="settings-header" onclick="toggleSettings()">
        <div class="settings-title">
          ⚙️ CONFIGURAR VALORES
        </div>
        <div class="settings-toggle" id="settingsToggle">▼</div>
      </div>
      <div class="settings-content" id="settingsContent">
        <div class="settings-grid" id="settingsGrid">
          <!-- Inputs serão gerados via JavaScript -->
        </div>
        <button class="save-settings-btn" onclick="saveSettings()">💾 SALVAR CONFIGURAÇÕES</button>
      </div>
    </div>

    <!-- History Section -->
    <div class="history-section">
      <div class="history-title">📜 HISTÓRICO DE PAGAMENTOS</div>
      <div class="history-list" id="historyList">
        <!-- Histórico será gerado via JavaScript -->
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Calculadora Sombra • <a href="../">Daoshi Store</a></p>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ============================================
    // 🔥 FIREBASE CONFIG
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyD6vn4IagySnIJ-0knlelyZmIWNV7qJnKk",
      authDomain: "daoshi-bot.firebaseapp.com",
      databaseURL: "https://daoshi-bot-default-rtdb.firebaseio.com",
      projectId: "daoshi-bot",
      storageBucket: "daoshi-bot.firebasestorage.app",
      messagingSenderId: "472062549464",
      appId: "1:472062549464:web:086c1c07d63a11ce3ca6ad"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sombraRef = db.ref('calculadoraSombra');

    // Configuração padrão dos pacotes - TODOS OS 3 JOGOS MIHOYO
    const DEFAULT_PACKAGES = [
      // === GENSHIN IMPACT ===
      { id: 'genshin_bencao', name: '🌟 Benção da Lua', price: 3.8, game: 'genshin' },
      { id: 'genshin_300', name: '🌟 300+30 Crystals', price: 3.8, game: 'genshin' },
      { id: 'genshin_980', name: '🌟 980+110 Crystals', price: 11.5, game: 'genshin' },
      { id: 'genshin_1980', name: '🌟 1980+260 Crystals', price: 22.75, game: 'genshin' },
      { id: 'genshin_3280', name: '🌟 3280+600 Crystals', price: 37, game: 'genshin' },
      { id: 'genshin_6480', name: '🌟 6480+1600 Crystals', price: 71, game: 'genshin' },
      
      // === HONKAI STAR RAIL ===
      { id: 'honkai_passe', name: '🚂 Passe de Suprimento', price: 3.8, game: 'honkai' },
      { id: 'honkai_300', name: '🚂 300+30 Fragmento', price: 3.8, game: 'honkai' },
      { id: 'honkai_980', name: '🚂 980+110 Fragmento', price: 11.5, game: 'honkai' },
      { id: 'honkai_1980', name: '🚂 1980+260 Fragmento', price: 22.75, game: 'honkai' },
      { id: 'honkai_3200', name: '🚂 3200+600 Fragmento', price: 37, game: 'honkai' },
      { id: 'honkai_6400', name: '🚂 6400+1600 Fragmento', price: 71, game: 'honkai' },
      
      // === ZENLESS ZONE ZERO ===
      { id: 'zzz_assinatura', name: '⚡ Assinatura Interlaço', price: 3.8, game: 'zzz' },
      { id: 'zzz_300', name: '⚡ 300+30 Monocromo', price: 3.8, game: 'zzz' },
      { id: 'zzz_980', name: '⚡ 980+110 Monocromo', price: 11.5, game: 'zzz' },
      { id: 'zzz_1980', name: '⚡ 1980+260 Monocromo', price: 22.75, game: 'zzz' },
      { id: 'zzz_3200', name: '⚡ 3200+600 Monocromo', price: 37, game: 'zzz' },
      { id: 'zzz_6400', name: '⚡ 6400+1600 Monocromo', price: 71, game: 'zzz' }
    ];

    // Estado da aplicação
    let packages = JSON.parse(localStorage.getItem('sombra_packages')) || DEFAULT_PACKAGES;
    let quantities = {};
    let history = [];
    let isLoading = true;

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      loadFromFirebase();
    });

    // Carregar dados do Firebase
    async function loadFromFirebase() {
      try {
        // Carregar pacotes (preços)
        const packagesSnap = await sombraRef.child('packages').once('value');
        if (packagesSnap.exists()) {
          const data = packagesSnap.val();
          // Converter objeto para array se necessário
          packages = Array.isArray(data) ? data : Object.values(data);
        } else {
          // Se não existe no Firebase, salvar os padrões
          await sombraRef.child('packages').set(DEFAULT_PACKAGES);
          packages = DEFAULT_PACKAGES;
        }

        // Carregar quantidades
        const quantitiesSnap = await sombraRef.child('quantities').once('value');
        if (quantitiesSnap.exists()) {
          quantities = quantitiesSnap.val() || {};
        }

        // Carregar histórico
        const historySnap = await sombraRef.child('history').once('value');
        if (historySnap.exists()) {
          const historyData = historySnap.val();
          history = Object.entries(historyData || {}).map(([key, val]) => ({ ...val, _key: key })).sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        isLoading = false;
        renderCards();
        renderSettings();
        renderHistory();
        updateTotal();
        showToast('✅ Dados carregados!');

        // Listener para mudanças em tempo real
        setupRealtimeListeners();
      } catch (error) {
        console.error('Erro ao carregar Firebase:', error);
        isLoading = false;
        // Usar dados padrão em caso de erro
        packages = DEFAULT_PACKAGES;
        renderCards();
        renderSettings();
        renderHistory();
        updateTotal();
        showToast('⚠️ Erro ao carregar - usando dados locais');
      }
    }

    // Listeners em tempo real
    function setupRealtimeListeners() {
      sombraRef.child('quantities').on('value', (snap) => {
        if (snap.exists() && !isLoading) {
          quantities = snap.val();
          renderCards();
          updateTotal();
        }
      });

      sombraRef.child('history').on('value', (snap) => {
        if (snap.exists() && !isLoading) {
          const data = snap.val();
          history = Object.entries(data).map(([key, val]) => ({ ...val, _key: key })).sort((a, b) => new Date(b.date) - new Date(a.date));
          renderHistory();
        } else if (!isLoading) {
          history = [];
          renderHistory();
        }
      });

      sombraRef.child('packages').on('value', (snap) => {
        if (snap.exists() && !isLoading) {
          packages = snap.val();
          renderCards();
          renderSettings();
          updateTotal();
        }
      });
    }

    // Renderizar cards dos pacotes
    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      packages.forEach(pkg => {
        const qty = quantities[pkg.id] || 0;
        const subtotal = (qty * pkg.price).toFixed(2);

        const card = document.createElement('div');
        card.className = 'package-card';
        card.innerHTML = `
          <div class="package-header">
            <div class="package-name">${pkg.name}</div>
            <div class="package-price">$${pkg.price.toFixed(2)} <span>/ un</span></div>
          </div>
          <div class="quantity-controls">
            <button class="qty-btn" onclick="changeQty('${pkg.id}', -1)">−</button>
            <div class="qty-display" id="qty-${pkg.id}">${qty}</div>
            <button class="qty-btn" onclick="changeQty('${pkg.id}', 1)">+</button>
          </div>
          <div class="package-subtotal">
            <span class="subtotal-label">Subtotal</span>
            <span class="subtotal-value" id="subtotal-${pkg.id}">$${subtotal}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Alterar quantidade
    function changeQty(id, delta) {
      quantities[id] = Math.max(0, (quantities[id] || 0) + delta);
      
      const pkg = packages.find(p => p.id === id);
      const subtotal = (quantities[id] * pkg.price).toFixed(2);
      
      document.getElementById(`qty-${id}`).textContent = quantities[id];
      document.getElementById(`subtotal-${id}`).textContent = `$${subtotal}`;
      
      updateTotal();
      saveQuantities();
    }

    // Atualizar total
    function updateTotal() {
      let total = 0;
      packages.forEach(pkg => {
        total += (quantities[pkg.id] || 0) * pkg.price;
      });
      document.getElementById('totalValue').textContent = total.toFixed(2);
    }

    // Salvar quantidades no Firebase
    function saveQuantities() {
      sombraRef.child('quantities').set(quantities);
    }

    // Zerar tudo
    function resetAll() {
      if (confirm('Tem certeza que deseja zerar todas as quantidades?')) {
        quantities = {};
        sombraRef.child('quantities').set({});
        renderCards();
        updateTotal();
        showToast('✅ Quantidades zeradas!');
      }
    }

    // Marcar como pago
    function markAsPaid() {
      let total = 0;
      packages.forEach(pkg => {
        total += (quantities[pkg.id] || 0) * pkg.price;
      });

      if (total <= 0) {
        showToast('Nenhum valor para registrar!');
        return;
      }

      if (confirm(`Confirmar pagamento de $${total.toFixed(2)}?`)) {
        // Adicionar ao histórico no Firebase
        const newEntry = {
          date: new Date().toISOString(),
          amount: total,
          status: 'paid',
          details: { ...quantities }
        };

        sombraRef.child('history').push(newEntry);

        // Zerar quantidades
        quantities = {};
        sombraRef.child('quantities').set({});
        renderCards();
        updateTotal();

        showToast(`✅ Pagamento de $${total.toFixed(2)} registrado!`);
      }
    }

    // Toggle settings
    function toggleSettings() {
      const content = document.getElementById('settingsContent');
      const toggle = document.getElementById('settingsToggle');
      content.classList.toggle('show');
      toggle.classList.toggle('open');
    }

    // Renderizar configurações
    function renderSettings() {
      const grid = document.getElementById('settingsGrid');
      grid.innerHTML = '';

      packages.forEach(pkg => {
        const item = document.createElement('div');
        item.className = 'setting-item';
        item.innerHTML = `
          <label class="setting-label">${pkg.name}</label>
          <input type="number" step="0.01" class="setting-input" 
                 id="setting-${pkg.id}" value="${pkg.price}" 
                 data-id="${pkg.id}">
        `;
        grid.appendChild(item);
      });
    }

    // Salvar configurações no Firebase
    function saveSettings() {
      packages.forEach(pkg => {
        const input = document.getElementById(`setting-${pkg.id}`);
        pkg.price = parseFloat(input.value) || 0;
      });

      sombraRef.child('packages').set(packages);
      renderCards();
      updateTotal();
      showToast('✅ Configurações salvas no Firebase!');
    }

    // Renderizar histórico
    function renderHistory() {
      const list = document.getElementById('historyList');
      
      if (history.length === 0) {
        list.innerHTML = '<div class="no-history">Nenhum pagamento registrado ainda.</div>';
        return;
      }

      list.innerHTML = '';
      history.slice(0, 20).forEach(item => {
        const date = new Date(item.date);
        const dateStr = date.toLocaleDateString('pt-BR') + ' ' + date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        
        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.innerHTML = `
          <div class="history-date">${dateStr}</div>
          <div class="history-amount">$${item.amount.toFixed(2)}</div>
          <div class="history-status status-paid">PAGO</div>
          <button class="history-delete" onclick="deleteHistoryItem('${item._key}')">🗑️</button>
        `;
        list.appendChild(historyItem);
      });
    }

    // Remover item do histórico
    function deleteHistoryItem(key) {
      if (confirm('Tem certeza que deseja remover este pagamento do histórico?')) {
        sombraRef.child('history').child(key).remove()
          .then(() => {
            showToast('✅ Pagamento removido!');
          })
          .catch(err => {
            console.error('Erro ao remover:', err);
            showToast('⚠️ Erro ao remover');
          });
      }
    }

    // Mostrar toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
