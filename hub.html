<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Acesso - Daoshi Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0612;
            --purple-vibrant: #9933ff;
            --purple-light: #b366ff;
            --pink: #ff69b4;
            --gold: #ffd700;
            --text-color: #f5f5f5;
            --card-bg: rgba(45, 27, 61, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0d24 50%, #2d1b3d 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-attachment: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            background: linear-gradient(135deg, var(--purple-vibrant), var(--pink), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .header p {
            color: var(--text-secondary);
            opacity: 0.8;
            font-size: 14px;
        }

        .hub-section {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 25px;
            padding-left: 10px;
            border-left: 4px solid var(--purple-vibrant);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .link-card {
            background: var(--card-bg);
            border: 2px solid rgba(153, 51, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-10px);
            border-color: var(--purple-vibrant);
            box-shadow: 0 10px 30px rgba(153, 51, 255, 0.4);
            background: rgba(153, 51, 255, 0.1);
        }

        .link-card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            transition: all 0.3s;
        }

        .link-card:hover img {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--purple-vibrant));
        }

        .link-card span {
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-grid {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }

        .link-card.admin {
            flex-direction: row;
            gap: 15px;
            padding: 15px 25px;
        }

        .link-card.admin .icon {
            font-size: 30px;
        }

        .link-card.admin div {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .link-card.admin small {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .links-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>DAOSHI HUB</h1>
        <p>Central de Acesso aos Sistemas do Bot</p>
    </div>

    <!-- SEÇÃO ADMIN -->
    <div class="hub-section">
        <h2 class="section-title">SISTEMA CENTRAL</h2>
        <div class="links-grid admin-grid">
            <a href="/Sites/admin/painel-admin.html" class="link-card admin">
                <span class="icon">📊</span>
                <div>
                    <span>Painel Admin</span>
                    <small>Vendas, Cupons e Clientes</small>
                </div>
            </a>
            <a href="/Sites/admin/configuracoes.html" class="link-card admin">
                <span class="icon">⚙️</span>
                <div>
                    <span>Configurações</span>
                    <small>Fornecedores e Prioridades</small>
                </div>
            </a>
        </div>
    </div>

    <!-- SEÇÃO FORNECEDORES -->
    <div class="hub-section">
        <h2 class="section-title">PAINÉIS DE FORNECEDORES</h2>
        <div class="links-grid">
            <a href="/Sites/providers/vaca.html" class="link-card">
                <img src="https://imgur.com/omKac7Z.png" alt="Vaca">
                <span>Vaca</span>
            </a>
            <a href="/Sites/providers/sombra.html" class="link-card">
                <img src="https://imgur.com/FxaKSF6.png" alt="Sombra">
                <span>Sombra</span>
            </a>
            <a href="/Sites/providers/lobolbw.html" class="link-card">
                <img src="https://imgur.com/Smr6uVN.png" alt="LoboLbw">
                <span>LoboLbw</span>
            </a>
            <a href="/Sites/providers/dw.html" class="link-card">
                <img src="https://imgur.com/7PSZliJ.png" alt="DW">
                <span>DW</span>
            </a>
            <a href="/Sites/providers/dog.html" class="link-card">
                <img src="https://imgur.com/oACewE5.png" alt="DOG">
                <span>DOG</span>
            </a>
            <a href="/Sites/providers/daodao.html" class="link-card">
                <img src="https://imgur.com/TymeeUK.png" alt="DaoDao">
                <span>DaoDao</span>
            </a>
            <a href="/Sites/providers/amarelo.html" class="link-card">
                <img src="https://imgur.com/JoNQWid.png" alt="Amarelo">
                <span>Amarelo</span>
            </a>
        </div>
    </div>

    <footer style="margin-top: 50px; opacity: 0.5; font-size: 12px;">
        Daoshi Store &copy; 2025 - Todos os direitos reservados
    </footer>
</body>
</html>
